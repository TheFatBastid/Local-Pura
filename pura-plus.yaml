# ============================================================
#  Pura Pro / Plus  ->  ESPHome
#  Heaters 12/13 (mutex, bang-bang regulator) · Thermistors 36/39
#  Fan 14 · LEDs 21(x2, white, DnD) · Buttons 15(L)/4(R)
#  NFC I2C SDA18/SCL5 IRQ27 · Accel INT 26 · CryptoAuth 0x36 (unused)
#
#  HA-facing controls (Controls section): Left bay · Right bay ·
#  Do not disturb · Run time.  Everything else = Config/Diagnostic
#  or hidden.  Any activation (HA or physical button) auto-offs
#  after the selected Run time (Always on = no timeout).
# ============================================================
esphome:
  name: pura-plus
  friendly_name: Pura Plus
  on_boot:
    priority: -100
    then:
      - output.turn_off: heater_left
      - output.turn_off: heater_right
      - output.turn_off: fan_out
      - light.turn_on: {id: led_strip, effect: "Manager"}   # always-on status/render effect

esp32:
  board: esp32dev
  framework: {type: arduino}

logger:
api:
  encryption: {key: !secret encryption_key}
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {ssid: "Pura-Plus Fallback", password: !secret fallback_password}
captive_portal:

# ---------------- NFC reader ----------------
external_components:
  - source: {type: local, path: components}
    components: [st25r3918]

st25r3918:
  id: nfc_reader
  irq_pin: GPIO27
  sda_pin: 18
  scl_pin: 5
  update_interval: 500ms
  # Optional: a `carts:` list maps specific cart UIDs to friendly names.
  # Omitted here — the per-bay sensors report the raw UID without it.

globals:
  - {id: on_left,      type: bool,  restore_value: false, initial_value: 'false'}
  - {id: on_right,     type: bool,  restore_value: false, initial_value: 'false'}
  - {id: target_left,  type: float, restore_value: true,  initial_value: '65.0'}
  - {id: target_right, type: float, restore_value: true,  initial_value: '65.0'}
  - {id: leds_enabled,   type: bool, restore_value: true,  initial_value: 'true'}   # false = Do Not Disturb
  - {id: ever_connected, type: bool, restore_value: false, initial_value: 'false'}  # HA seen since boot? rainbow vs red

# ---------------- Outputs ----------------
output:
  - {platform: gpio, id: heater_left,  pin: GPIO12}
  - {platform: gpio, id: heater_right, pin: GPIO13}
  - {platform: gpio, id: fan_out,      pin: GPIO14}

# ---------------- LEDs (2-pixel WS2812) — rendered by one always-on "Manager" effect ----------------
# Per-frame priority: DnD>off · no-HA>rainbow(new)/red-pulse(lost) · diffusing>white|orange-low · idle>off
light:
  - platform: esp32_rmt_led_strip
    id: led_strip
    pin: GPIO21
    num_leds: 2
    chipset: WS2812
    rgb_order: GRB
    internal: true
    default_transition_length: 0s
    effects:
      - addressable_lambda:
          name: "Manager"
          update_interval: 40ms
          lambda: |-
            uint32_t t = millis();
            if (!id(leds_enabled)) { it.all() = Color::BLACK; return; }        // DnD
            if (!id(api_status).state) {                                       // no HA link
              if (id(ever_connected)) {                                        // lost -> alternating red
                bool ph = (t / 400) % 2;
                for (int i = 0; i < it.size(); i++)
                  it[i] = (((i % 2) == 0) == ph) ? Color(255,0,0) : Color::BLACK;
              } else {                                                         // first connect -> rainbow wash
                uint8_t base = (t / 20) & 0xFF;
                for (int i = 0; i < it.size(); i++)
                  it[i] = ESPHSVColor(base + i * (255 / it.size()), 255, 255).to_rgb();
              }
              return;
            }
            if (id(on_left) || id(on_right)) {                                 // diffusing
              float rem = id(scent_rem).state;
              if (!isnan(rem) && rem <= 10.0f) {                               // low -> orange breathing
                float ph = sinf(t / 400.0f) * 0.5f + 0.5f;
                uint8_t b = 20 + (uint8_t)(ph * 220);
                it.all() = Color(b, (uint8_t)(b * 45 / 255), 0);
                return;
              }
              it.all() = Color::BLACK;                                         // white on the active bay
              if (id(on_left)) {
                auto s = id(strength_left).state;
                float br = (s == "Subtle") ? 0.33f : (s == "Strong") ? 1.0f : 0.66f;
                uint8_t w = (uint8_t)(br * 255); it[1] = Color(w,w,w);         // pixel 1 = left
              }
              if (id(on_right)) {
                auto s = id(strength_right).state;
                float br = (s == "Subtle") ? 0.33f : (s == "Strong") ? 1.0f : 0.66f;
                uint8_t w = (uint8_t)(br * 255); it[0] = Color(w,w,w);         // pixel 0 = right
              }
              return;
            }
            it.all() = Color::BLACK;                                           // idle

fan:
  - platform: binary
    id: diffuser_fan
    name: "Fan"
    internal: true                                # follows the active bay
    output: fan_out

# ---------------- Sensors ----------------
sensor:
  - platform: st25r3918
    usage_time: {name: "Fragrance runtime", entity_category: diagnostic}
    scent_remaining: {name: "Fragrance remaining", id: scent_rem}   # % — low warning + tile colour
  # Hardware-version divider (GPIO34) — voltage identifies the model/board rev
  - platform: adc
    pin: GPIO34
    id: hw_version_v
    name: "HW version voltage"
    attenuation: 12db
    update_interval: 30s
    accuracy_decimals: 3
    entity_category: diagnostic
  - platform: adc
    id: adc_left
    pin: GPIO36
    attenuation: 12db
    update_interval: 100ms
    internal: true
    filters:
      - median: {window_size: 9, send_every: 10, send_first_at: 5}   # reject heater-switching spikes
  - {platform: resistance, id: res_left,  sensor: adc_left,  configuration: UPSTREAM, resistor: 5.36kOhm, internal: true}
  - platform: ntc
    id: temp_left
    name: "Left bay temperature"
    sensor: res_left
    unit_of_measurement: "°C"
    entity_category: diagnostic
    calibration: {b_constant: 3950, reference_temperature: 25°C, reference_resistance: 58kOhm}
    on_value_range:
      - above: 85.0
        then: [{switch.turn_off: diffuser_left}]     # redundant hard backstop
  - platform: adc
    id: adc_right
    pin: GPIO39
    attenuation: 12db
    update_interval: 100ms
    internal: true
    filters:
      - median: {window_size: 9, send_every: 10, send_first_at: 5}   # reject heater-switching spikes
  - {platform: resistance, id: res_right, sensor: adc_right, configuration: UPSTREAM, resistor: 5.36kOhm, internal: true}
  - platform: ntc
    id: temp_right
    name: "Right bay temperature"
    sensor: res_right
    unit_of_measurement: "°C"
    entity_category: diagnostic
    calibration: {b_constant: 3950, reference_temperature: 25°C, reference_resistance: 58kOhm}
    on_value_range:
      - above: 85.0
        then: [{switch.turn_off: diffuser_right}]

text_sensor:
  - platform: template
    name: "Model"
    icon: mdi:chip
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      float v = id(hw_version_v).state;
      if (isnan(v)) return {};                 // keep previous until ADC settles
      if (v < 0.45) return {"Pura Wall 4"};    // ~0.14 V
      if (v < 1.20) return {"Pura Plus"};      // ~0.81 V
      return {"Unknown"};
  - platform: st25r3918
    cart_id_bay1: {name: "Bay 1 cart ID"}              # cart IDs default to diagnostic
    cart_id_bay2: {name: "Bay 2 cart ID"}
    fragrance_name_bay1: {name: "Bay 1 fragrance"}     # fragrance names stay visible (card shows them)
    fragrance_name_bay2: {name: "Bay 2 fragrance"}

binary_sensor:
  - platform: st25r3918
    present_bay1: {name: "Bay 1 present"}              # card uses these to draw bays
    present_bay2: {name: "Bay 2 present"}
    tag_present: {name: "Any cart present", entity_category: diagnostic}
  - platform: status
    id: api_status
    name: "Status"
    entity_category: diagnostic
    on_state:
      - if: {condition: {lambda: 'return x;'}, then: [{globals.set: {id: ever_connected, value: 'true'}}]}
  - platform: template
    name: "Fragrance low"
    id: frag_low
    device_class: problem
    lambda: |-
      float r = id(scent_rem).state;
      if (isnan(r)) return {};
      return r <= 10.0;
  - platform: gpio
    id: btn_left
    name: "Left button"
    internal: true                                     # physical button — no HA entity, still toggles
    pin: {number: GPIO15, mode: INPUT_PULLUP, inverted: true}
    filters: [{delayed_on: 20ms}, {delayed_off: 20ms}]
    on_press: [{switch.toggle: left_bay_timed}]        # manual toggle -> arms auto-off
  - platform: gpio
    id: btn_right
    name: "Right button"
    internal: true
    pin: {number: GPIO4, mode: INPUT_PULLUP, inverted: true}
    filters: [{delayed_on: 20ms}, {delayed_off: 20ms}]
    on_press: [{switch.toggle: right_bay_timed}]

# ---------------- Per-bay strength (target temp) + Run time ----------------
select:
  - platform: template
    name: "Left strength"
    id: strength_left
    optimistic: true
    entity_category: config
    options: ["Subtle", "Medium", "Strong"]
    initial_option: "Medium"
    on_value:
      - lambda: 'id(target_left) = (x=="Subtle")?55.0 : (x=="Strong")?75.0 : 65.0;'
  - platform: template
    name: "Right strength"
    id: strength_right
    optimistic: true
    entity_category: config
    options: ["Subtle", "Medium", "Strong"]
    initial_option: "Medium"
    on_value:
      - lambda: 'id(target_right) = (x=="Subtle")?55.0 : (x=="Strong")?75.0 : 65.0;'
  # Auto-off duration for a manual activation (physical button or HA toggle)
  - platform: template
    name: "Run time"
    id: run_time
    icon: mdi:timer-outline
    optimistic: true
    restore_value: true
    options: ["30 min", "60 min", "90 min", "Always on"]
    initial_option: "60 min"
    on_value:
      # re-arm the running bay with the new duration (or cancel if Always on)
      - if:
          condition: {lambda: 'return x == "Always on";'}
          then: [{script.stop: autooff_left}, {script.stop: autooff_right}]
          else:
            - if: {condition: {lambda: 'return id(on_left);'},  then: [{script.execute: autooff_left}]}
            - if: {condition: {lambda: 'return id(on_right);'}, then: [{script.execute: autooff_right}]}

# ---------------- Auto-off timers (one per bay; duration read from Run time) ----------------
script:
  - id: autooff_left
    mode: restart
    then:
      - delay: !lambda |-
          auto s = id(run_time).state;
          if (s == "30 min") return 1800000UL;
          if (s == "90 min") return 5400000UL;
          return 3600000UL;                          // default 60 min
      - switch.turn_off: diffuser_left
  - id: autooff_right
    mode: restart
    then:
      - delay: !lambda |-
          auto s = id(run_time).state;
          if (s == "30 min") return 1800000UL;
          if (s == "90 min") return 5400000UL;
          return 3600000UL;
      - switch.turn_off: diffuser_right

# ---------------- Heater regulator (bang-bang + safety) ----------------
interval:
  - interval: 1s
    then:
      - lambda: |-
          // LEFT
          if (id(on_left)) {
            float t = id(temp_left).state;
            if (isnan(t)) { id(heater_left).turn_off(); }
            else if (t >= 85.0) { id(heater_left).turn_off(); id(diffuser_left).turn_off(); }
            else if (t < id(target_left) - 1.0) { id(heater_left).turn_on(); }
            else if (t > id(target_left)) { id(heater_left).turn_off(); }
          }
          // RIGHT
          if (id(on_right)) {
            float t = id(temp_right).state;
            if (isnan(t)) { id(heater_right).turn_off(); }
            else if (t >= 85.0) { id(heater_right).turn_off(); id(diffuser_right).turn_off(); }
            else if (t < id(target_right) - 1.0) { id(heater_right).turn_on(); }
            else if (t > id(target_right)) { id(heater_right).turn_off(); }
          }

# ---------------- Switches ----------------
switch:
  - platform: template
    name: "Left bay"
    id: diffuser_left
    icon: mdi:scent
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: 'return id(on_left);'
    turn_on_action:
      - switch.turn_off: diffuser_right          # one bay at a time (stops its auto-off too)
      - globals.set: {id: on_left, value: 'true'}
      - lambda: 'id(nfc_reader).set_heating(true);'
      - fan.turn_on: diffuser_fan
      # LEDs rendered by the Manager effect. Auto-off armed only on manual paths
      # (left_bay_timed); raw turn_on here = schedules, uncut.
    turn_off_action:
      - globals.set: {id: on_left, value: 'false'}
      - script.stop: autooff_left
      - output.turn_off: heater_left
      - lambda: 'id(nfc_reader).set_heating(false);'
      - if:
          condition: {lambda: 'return !id(on_right);'}
          then: [{fan.turn_off: diffuser_fan}]
  - platform: template
    name: "Right bay"
    id: diffuser_right
    icon: mdi:scent
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: 'return id(on_right);'
    turn_on_action:
      - switch.turn_off: diffuser_left
      - globals.set: {id: on_right, value: 'true'}
      - lambda: 'id(nfc_reader).set_heating(true);'
      - fan.turn_on: diffuser_fan
      # LEDs via Manager effect; auto-off armed only on manual paths (right_bay_timed)
    turn_off_action:
      - globals.set: {id: on_right, value: 'false'}
      - script.stop: autooff_right
      - output.turn_off: heater_right
      - lambda: 'id(nfc_reader).set_heating(false);'
      - if:
          condition: {lambda: 'return !id(on_left);'}
          then: [{fan.turn_off: diffuser_fan}]
  # Do Not Disturb: ON = suppress bay LEDs even while diffusing (night mode)
  - platform: template
    name: "Do not disturb"
    id: dnd_switch
    icon: mdi:sleep
    restore_mode: DISABLED                         # state derives from leds_enabled (which persists)
    lambda: 'return !id(leds_enabled);'
    turn_on_action:
      - globals.set: {id: leds_enabled, value: 'false'}    # Manager renders black
    turn_off_action:
      - globals.set: {id: leds_enabled, value: 'true'}     # Manager restores per state
  # Card/physical-button toggle that ARMS the auto-off on turn-on (plain off on turn-off).
  # Mirrors bay state. Schedules use switch.diffuser_left/right (raw) and stay uncut.
  - platform: template
    name: "Left bay timed"
    id: left_bay_timed
    icon: mdi:timer-cog
    entity_category: config
    lambda: 'return id(on_left);'
    turn_on_action:
      - switch.turn_on: diffuser_left
      - if:
          condition: {lambda: 'return id(run_time).state != "Always on";'}
          then: [{script.execute: autooff_left}]
    turn_off_action:
      - switch.turn_off: diffuser_left
  - platform: template
    name: "Right bay timed"
    id: right_bay_timed
    icon: mdi:timer-cog
    entity_category: config
    lambda: 'return id(on_right);'
    turn_on_action:
      - switch.turn_on: diffuser_right
      - if:
          condition: {lambda: 'return id(run_time).state != "Always on";'}
          then: [{script.execute: autooff_right}]
    turn_off_action:
      - switch.turn_off: diffuser_right

button:
  - platform: restart
    name: "Restart"
    entity_category: diagnostic
